
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>FII DII Dashboard</title>

<style>
* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: linear-gradient(180deg, #020617, #0f172a);
  color: white;
  margin: 0;
  padding: 15px;
}

h2 {
  text-align: center;
  margin-bottom: 5px;
}

.subtitle {
  text-align: center;
  font-size: 12px;
  color: #94a3b8;
  margin-top: 0;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
  margin: 15px 0;
}

.card {
  background: rgba(30, 41, 59, 0.95);
  padding: 12px 8px;
  border-radius: 12px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.3);
  min-width: 0;
}

.title {
  font-size: 14px;
  font-weight: bold;
  text-align: center;
  margin-bottom: 10px;
  color: #e2e8f0;
}

.row {
  display: flex;
  justify-content: space-between;
  gap: 4px;
  font-size: 12px;
  padding: 5px 0;
  border-bottom: 1px solid #334155;
}

.row:last-child {
  border-bottom: none;
}

.green {
  color: #22c55e;
  font-weight: bold;
}

.red {
  color: #ef4444;
  font-weight: bold;
}

.neutral {
  color: #e2e8f0;
  font-weight: bold;
}

button {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 8px;
  background: #2563eb;
  color: white;
  font-weight: bold;
  cursor: pointer;
  margin-top: 10px;
  font-size: 14px;
}

button:disabled {
  opacity: 0.6;
  cursor: wait;
}

button:hover {
  background: #1d4ed8;
}

.tableCard {
  background: rgba(30, 41, 59, 0.95);
  padding: 12px;
  border-radius: 12px;
  margin-top: 15px;
  overflow-x: auto;
}

.tableTitle {
  font-size: 16px;
  font-weight: bold;
  text-align: center;
  margin-bottom: 12px;
}

table {
  width: 100%;
  min-width: 340px;
  border-collapse: collapse;
  font-size: 13px;
}

th, td {
  padding: 10px 7px;
  text-align: center;
  border-bottom: 1px solid #374151;
}

th {
  color: #93c5fd;
  background: #1e293b;
  position: sticky;
  top: 0;
}

.status {
  text-align: center;
  color: #94a3b8;
  font-size: 13px;
  padding: 12px;
}

.footer {
  text-align: center;
  font-size: 11px;
  color: #64748b;
  margin-top: 15px;
}

@media(max-width: 420px) {
  body {
    padding: 10px;
  }

  .grid {
    gap: 6px;
  }

  .card {
    padding: 10px 6px;
  }

  .title {
    font-size: 12px;
  }

  .row {
    font-size: 11px;
  }
}
</style>
</head>

<body>

<h2>📊 FII / DII Dashboard</h2>

<p class="subtitle">
Institutional Cash Market Activity | NSE & BSE
</p>

<!-- SUMMARY CARDS -->

<div class="grid">

  <div id="today" class="card">
    <div class="status">Loading...</div>
  </div>

  <div id="yesterday" class="card">
    <div class="status">Loading...</div>
  </div>

  <div id="mtd" class="card">
    <div class="status">Loading...</div>
  </div>

</div>

<button id="refreshBtn" onclick="loadDashboard()">
  🔄 Refresh Dashboard
</button>

<button id="monthlyBtn" onclick="loadMonthly()">
  📅 View All Monthly Data
</button>

<div id="monthly"></div>

<p class="footer">
Source: Connected Google Apps Script API
</p>

<script>

// =====================================
// API URL
// =====================================

const API =
"https://script.google.com/macros/s/AKfycbxaLJdfOHI2rmDGhI_WdjyWkHrAlycOCepsgORmNnbDXnWzNxtasdGZW3yxftKvWhq8Iw/exec";


// =====================================
// FORMAT FUNCTIONS
// =====================================

function color(value) {

  const n = Number(value);

  if (!Number.isFinite(n)) return "neutral";

  return n >= 0 ? "green" : "red";
}


function round(value) {

  const n = Number(value);

  if (!Number.isFinite(n)) return "—";

  return Math.round(n).toLocaleString("en-IN");
}


function formatMonth(value) {

  if (!value) return "—";

  const match = String(value).match(/^(\d{4})-(\d{1,2})$/);

  if (match) {

    const year = Number(match[1]);
    const month = Number(match[2]);

    if (month < 1 || month > 12) return value;

    const date = new Date(year, month - 1, 1);

    const monthName = date.toLocaleString("en-IN", {
      month: "short"
    });

    return monthName + "-" + year;
  }

  return value;
}


// =====================================
// SUMMARY CARD
// =====================================

function createCard(title, item) {

  if (!item) {
    return `
      <div class="title">${title}</div>
      <div class="status">No data available</div>
    `;
  }

  return `
    <div class="title">${title}</div>

    <div class="row">
      <span>Date</span>
      <span>${item.date || "—"}</span>
    </div>

    <div class="row">
      <span>FII</span>
      <span class="${color(item.fii)}">
        ${round(item.fii)}
      </span>
    </div>

    <div class="row">
      <span>DII</span>
      <span class="${color(item.dii)}">
        ${round(item.dii)}
      </span>
    </div>

    <div class="row">
      <span>Net</span>
      <span class="${color(item.net)}">
        ${round(item.net)}
      </span>
    </div>
  `;
}


// =====================================
// LOAD DASHBOARD
// =====================================

async function loadDashboard() {

  const button = document.getElementById("refreshBtn");

  button.disabled = true;
  button.textContent = "Loading...";

  try {

    const response = await fetch(
      API + "?action=fiidashboard"
    );

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    const data = await response.json();

    if (data.error) {
      throw new Error(data.error);
    }

    document.getElementById("today").innerHTML =
      createCard("Today", data.today);

    document.getElementById("yesterday").innerHTML =
      createCard("Yesterday", data.yesterday);

    document.getElementById("mtd").innerHTML =
      createCard("MTD", data.mtd);

  } catch (error) {

    const message = `
      <div class="status">
        Unable to load data<br>
        ${error.message}
      </div>
    `;

    document.getElementById("today").innerHTML = message;
    document.getElementById("yesterday").innerHTML = message;
    document.getElementById("mtd").innerHTML = message;

  } finally {

    button.disabled = false;
    button.textContent = "🔄 Refresh Dashboard";

  }
}


// =====================================
// LOAD ALL MONTHLY DATA
// =====================================

async function loadMonthly() {

  const container = document.getElementById("monthly");
  const button = document.getElementById("monthlyBtn");

  button.disabled = true;
  button.textContent = "Loading monthly data...";

  container.innerHTML =
    '<div class="status">Fetching monthly data...</div>';

  try {

    const response = await fetch(
      API + "?action=fiimonthly"
    );

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    const data = await response.json();

    if (!Array.isArray(data)) {
      throw new Error("Unexpected monthly API response");
    }

    if (data.length === 0) {

      container.innerHTML =
        '<div class="status">No monthly data available.</div>';

      return;
    }

    // Newest month first

    data.sort((a, b) =>
      String(b.month).localeCompare(String(a.month))
    );

    let html = `
      <div class="tableCard">

        <div class="tableTitle">
          📅 Monthly Institutional Flow
        </div>

        <table>

          <thead>
            <tr>
              <th>Month</th>
              <th>FII</th>
              <th>DII</th>
              <th>Net</th>
            </tr>
          </thead>

          <tbody>
    `;

    data.forEach(item => {

      html += `
        <tr>

          <td>
            <b>${formatMonth(item.month)}</b>
          </td>

          <td class="${color(item.fii)}">
            ${round(item.fii)}
          </td>

          <td class="${color(item.dii)}">
            ${round(item.dii)}
          </td>

          <td class="${color(item.net)}">
            ${round(item.net)}
          </td>

        </tr>
      `;

    });

    html += `
          </tbody>
        </table>

        <p class="status">
          Total months available: ${data.length}
        </p>

      </div>
    `;

    container.innerHTML = html;

    button.textContent = "📅 Monthly Data Loaded";

  } catch (error) {

    container.innerHTML = `
      <div class="tableCard">
        <div class="status">
          Unable to load monthly data<br>
          ${error.message}
        </div>
      </div>
    `;

  } finally {

    button.disabled = false;

    if (!container.innerHTML.includes("Monthly Data Loaded")) {
      button.textContent = "📅 View All Monthly Data";
    }

  }
}


// =====================================
// INITIAL LOAD
// =====================================

loadDashboard();

</script>

</body>
</html>
