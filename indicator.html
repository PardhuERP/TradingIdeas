<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>NIFTY TradingView</title>  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
    }

    .chart {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .open-btn {
      position: fixed;
      top: 15px;
      right: 15px;
      z-index: 10;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: #2962ff;
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .open-btn:hover {
      opacity: 0.9;
    }
  </style></head><body>  <button class="open-btn" onclick="openTradingView()">
    Open TradingView
  </button>  <iframe
    class="chart"
    src="https://www.tradingview.com/chart/LrVdD8IX/"
    allowfullscreen>
  </iframe>  <script>
    function openTradingView() {
      window.open(
        "https://www.tradingview.com/chart/LrVdD8IX/",
        "_blank"
      );
    }
  </script></body>
</html>
