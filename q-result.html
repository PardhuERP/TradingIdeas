<!DOCTYPE html>
<html>
<head>
    <title>Quarterly Results</title>
</head>

<body style="background:#111;color:white;font-family:Arial;text-align:center">

<h1>TCS Quarterly Results</h1>

<div id="data">Loading...</div>

<script>
async function loadData() {
    const url = "YOUR_GAS_WEBAPP_URL"; // paste your GAS deployed URL

    let res = await fetch(url);
    let data = await res.json();

    document.getElementById("data").innerHTML = `
        <h2>Net Profit (₹ Cr)</h2>
        Q1: ${data.Q1} <br>
        Q2: ${data.Q2} <br>
        Q3: ${data.Q3} <br>
        Q4: ${data.Q4}
    `;
}

loadData();
</script>

</body>
</html>
